services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarttube-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Montage à chaud du code pour le rechargement en développement
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
